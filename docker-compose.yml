services:
  portfolio:
    image: ghcr.io/fastapi-argocd-test/simple-fastapi:latest
    container_name: portfolio
    ports:
      - "8050:8000"
    environment:
      PROFILE_NAME: "portfolio-name"
      CONTENT_DIR: "/docs"
      DEFAULT_MD: "portfolio.md"
    volumes:
      - "{docs}:/docs:ro"
    restart: unless-stopped
